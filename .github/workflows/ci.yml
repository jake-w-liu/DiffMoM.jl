name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  actions: write
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.os }} / ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia: '1.13'
            threads: 1
          - os: ubuntu-latest
            julia: '1.13'
            threads: 4
          - os: macos-latest
            julia: '1.13'
            threads: 1
          - os: windows-latest
            julia: '1.13'
            threads: 1
          - os: ubuntu-latest
            julia: '1.12'
            threads: 1
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      JULIA_NUM_PRECOMPILE_TASKS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
        with:
          # Do not restore compiled state saved after earlier interrupted
          # Windows precompiles, and never publish a cache from a failed job.
          cache-name: diffmom-julia-cache-v2
          save-always: false
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # No coverage artifact is consumed in this matrix. Julia's
          # coverage-instrumented precompile exceeded an hour on Windows.
          coverage: false

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: 1
      JULIA_NUM_PRECOMPILE_TASKS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
        with:
          cache-name: diffmom-julia-cache-v2
          save-always: false
      - name: Build documentation
        run: julia --startup-file=no --project=docs docs/make.jl

  quality:
    name: Slopfix quality contract
    needs: [test, docs]
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: 1
      JULIA_NUM_PRECOMPILE_TASKS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12.7'
      # Pin the exact patch: the slopfix line counter identity is
      # pinned to the baseline toolchain; measuring under another Julia
      # version is rejected as a cross-counter comparison.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: validation/tests/requirements.txt
      - uses: julia-actions/cache@v3
        with:
          cache-name: diffmom-julia-cache-v2
          save-always: false
      - name: Install validation-test dependencies
        run: python -m pip install --requirement validation/tests/requirements.txt
      # Initialize the package using the same compiler settings as
      # Pkg.test's test process.
      # The strict command still executes the complete test suite itself.
      - name: Initialize Julia package for bounds-checked tests
        run: >-
          julia --startup-file=no --project=. --check-bounds=yes
          --warn-overwrite=yes --depwarn=yes --compiled-modules=yes
          -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Check reduction ratchets and blocking smells
        shell: bash
        run: |
          line_ceiling="$(tr -d '[:space:]' < .slopfix/line-ceiling.txt)"
          python3 scripts/slopfix.py measure --strict --ceiling "$line_ceiling"
          python3 scripts/slopfix.py smells --severity blocking --strict
          python3 scripts/slopfix.py census --max-groups 400 --json > "$RUNNER_TEMP/slopfix-census.json"
          python3 scripts/check_slopfix_census.py \
            "$RUNNER_TEMP/slopfix-census.json" \
            .slopfix/duplication-ceiling.txt
      - name: Run reviewed ISO/IEC 25010 quality contract
        run: python3 scripts/slopfix.py quality-check --run --strict
      - name: Preserve quality command evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slopfix-quality-report
          path: .slopfix/quality-report.json
          include-hidden-files: true
          if-no-files-found: warn
