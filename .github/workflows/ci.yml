name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  actions: write
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.os }} / ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia: '1.13'
            threads: 1
          - os: ubuntu-latest
            julia: '1.13'
            threads: 4
          - os: macos-latest
            julia: '1.13'
            threads: 1
          - os: windows-latest
            julia: '1.13'
            threads: 1
          - os: ubuntu-latest
            julia: '1.12'
            threads: 1
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      JULIA_NUM_PRECOMPILE_TASKS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
        with:
          # Do not restore compiled state saved after earlier interrupted
          # Windows precompiles, and never publish a cache from a failed job.
          cache-name: diffmom-julia-cache-v2
          save-always: false
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # No coverage artifact is consumed in this matrix. Julia's
          # coverage-instrumented precompile exceeded an hour on Windows.
          coverage: false

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: 1
      JULIA_NUM_PRECOMPILE_TASKS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
        with:
          cache-name: diffmom-julia-cache-v2
          save-always: false
      - name: Build documentation
        run: julia --startup-file=no --project=docs docs/make.jl
