name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  actions: write
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia 1.12 / ${{ matrix.os }} / ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            threads: 1
          - os: ubuntu-latest
            threads: 4
          - os: macos-latest
            threads: 1
          - os: windows-latest
            threads: 1
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      JULIA_NUM_PRECOMPILE_TASKS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JULIA_NUM_THREADS: 1
      JULIA_NUM_PRECOMPILE_TASKS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Build documentation
        run: julia --startup-file=no --project=docs docs/make.jl

  quality:
    name: Slopfix quality contract
    needs: [test, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JULIA_NUM_THREADS: 1
      JULIA_NUM_PRECOMPILE_TASKS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: validation/tests/requirements.txt
      - uses: julia-actions/cache@v3
      - name: Install validation-test dependencies
        run: python -m pip install --requirement validation/tests/requirements.txt
      - name: Check reduction ratchets and blocking smells
        shell: bash
        run: |
          line_ceiling="$(tr -d '[:space:]' < .slopfix/line-ceiling.txt)"
          python3 scripts/slopfix.py measure --strict --ceiling "$line_ceiling"
          python3 scripts/slopfix.py smells --severity blocking --strict
          python3 scripts/slopfix.py census --max-groups 400 --json > "$RUNNER_TEMP/slopfix-census.json"
          python3 scripts/check_slopfix_census.py \
            "$RUNNER_TEMP/slopfix-census.json" \
            .slopfix/duplication-ceiling.txt
      - name: Run reviewed ISO/IEC 25010 quality contract
        run: python3 scripts/slopfix.py quality-check --run --strict
