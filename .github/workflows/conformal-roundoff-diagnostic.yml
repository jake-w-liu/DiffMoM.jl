name: Conformal ARM64 production verification

"on":
  push:
    branches: [audit/conformal-roundoff-diagnostic-20261005]

permissions:
  contents: read

jobs:
  capture:
    name: ARM64 original conformal tests and compensated production updates
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      JULIA_NUM_THREADS: 1
      JULIA_NUM_PRECOMPILE_TASKS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: diffmom-julia-cache-v2
          save-always: false
      - uses: julia-actions/julia-buildpkg@v1
      - name: Verify actual production module and unchanged conformal gates
        shell: bash
        run: julia --startup-file=no --check-bounds=yes --project=. validation/planar_audit/conformal_production_arm_proof.jl
