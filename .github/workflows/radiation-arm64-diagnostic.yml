name: Radiation allocation diagnostic

"on":
  push:
    branches: [audit/radiation-arm64-profile-20261005]

permissions:
  contents: read

jobs:
  profile:
    name: ARM64 radiation allocation profile
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: 1
      JULIA_NUM_PRECOMPILE_TASKS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: diffmom-julia-cache-v2
          save-always: false
      - name: Instantiate diagnostic environment
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Prepare the package test dependency environment
        shell: bash
        run: |
          export RADIATION_DIAGNOSTIC_ENV="$RUNNER_TEMP/radiation-test-env"
          echo "RADIATION_DIAGNOSTIC_ENV=$RADIATION_DIAGNOSTIC_ENV" >> "$GITHUB_ENV"
          julia --startup-file=no --project=. -e '
            using Pkg,TOML
            root=realpath(pwd());project=TOML.parsefile(joinpath(root,"Project.toml"))
            env=ENV["RADIATION_DIAGNOSTIC_ENV"];mkpath(env)
            open(joinpath(env,"Project.toml"),"w") do io
                TOML.print(io,Dict("deps"=>merge(project["deps"],project["extras"]),
                    "compat"=>project["compat"]))
            end
            Pkg.activate(env);Pkg.develop(PackageSpec(path=root));Pkg.instantiate()'
      - name: Profile the original radiation allocation case
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/radiation-profile.jl" <<'JULIA'
          using DiffMoM, Profile, LinearAlgebra, SHA
          BLAS.set_num_threads(1)
          source=read(joinpath(pkgdir(DiffMoM),"src","postprocessing","FarField.jl"),String)
          @assert occursin("real_magnitudes = zero(Vec3)",source)
          println("SOURCE_SHA256 ",bytes2hex(sha256(source)))
          mesh=make_rect_plate(1.0,1.0,12,12)
          rwg=build_rwg(mesh);grid=make_sph_grid(8,16)
          k=parse(Float64,only(ARGS))
          function measure(mesh,rwg,grid,k)
              radiation_vectors(mesh,rwg,grid,k;quad_order=3)
              samples=ntuple(3) do _
                  @allocated radiation_vectors(mesh,rwg,grid,k;quad_order=3)
              end
              minimum(samples)
          end
          function output_allocation(rows,cols)
              zeros(ComplexF64,rows,cols)
              [@allocated(zeros(ComplexF64,rows,cols)) for _ in 1:3]
          end
          println("VERSION ",VERSION," ARCH ",Sys.ARCH," EDGES ",rwg.nedges,
              " OPT ",Base.JLOptions().opt_level," DEPWARN ",Base.JLOptions().depwarn)
          println("SAMPLES ",ntuple(_->measure(mesh,rwg,grid,k),3))
          println("OUTPUT_SAMPLES ",output_allocation(3length(grid.w),rwg.nedges))
          function profile_call(mesh,rwg,grid,k)
              Profile.Allocs.clear()
              Profile.Allocs.@profile sample_rate=1.0 radiation_vectors(mesh,rwg,grid,k;quad_order=3)
          end
          root=realpath(pwd());testfile=joinpath(root,"test","runtests.jl")
          original=read(testfile,String)
          println("ORIGINAL_TEST_SHA256 ",bytes2hex(sha256(original)))
          boundary=findfirst("@test radiation_alloc <= radiation_output_bytes + 2_250_000",original).start
          # Run the untouched prefix and stop immediately before the known
          # failing assertion, then measure it. This is a partial diagnostic,
          # not a full-suite pass or a suppression in the main CI workflow.
          prefixfile=joinpath(dirname(testfile),"radiation-diagnostic-prefix.jl")
          @assert !ispath(prefixfile)
          try
              write(prefixfile,original[1:prevind(original,boundary)])
              Base.include(Main,prefixfile)
          finally
              rm(prefixfile;force=true)
          end
          println("PREFIX_ALLOC ",radiation_alloc," LIMIT ",radiation_output_bytes+2_250_000)
          println("PREFIX_BIGFLOAT_PRECISION ",precision(BigFloat))
          @assert bytes2hex(sha256(read(testfile)))==bytes2hex(sha256(original))
          Profile.Allocs.clear()
          Profile.Allocs.@profile sample_rate=1.0 _radiation_vectors_allocation(
              mesh_radiation_alloc,rwg_radiation_alloc,grid_radiation_alloc,2π)
          groups=Dict{String,Tuple{Int,Int}}()
          for allocation in Profile.Allocs.fetch().allocs
              frame=findfirst(f->occursin("FarField.jl",String(f.file)),allocation.stacktrace)
              key=frame===nothing ? string(allocation.type) : string(allocation.stacktrace[frame])
              bytes,count=get(groups,key,(0,0))
              groups[key]=(bytes+allocation.size,count+1)
          end
          for (key,(bytes,count)) in sort!(collect(groups);by=x->-last(x)[1])[1:min(40,length(groups))]
              println("PROFILE ",bytes," ",count," ",key)
          end
          println("RADIATION_ARM64_ALLOCATION_PROFILE_COMPLETE")
          JULIA
          julia --code-coverage=none --color=yes --warn-overwrite=yes --depwarn=yes --inline=yes --startup-file=no --track-allocation=none --check-bounds=yes --compiled-modules=yes --project="$RADIATION_DIAGNOSTIC_ENV" "$RUNNER_TEMP/radiation-profile.jl" 6.283185307179586
