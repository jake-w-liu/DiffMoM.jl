name: Radiation allocation diagnostic

"on":
  push:
    branches: [audit/radiation-arm64-profile-20261005]

permissions:
  contents: read

jobs:
  profile:
    name: ARM64 allocation diagnostic (partial original test)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: 1
      JULIA_NUM_PRECOMPILE_TASKS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.1'
      - uses: julia-actions/cache@v3
        with:
          cache-name: diffmom-julia-cache-v2
          save-always: false
      - uses: julia-actions/julia-buildpkg@v1
      - name: Profile the original Pkg.test call order
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/radiation-pkg-profile.jl" <<'JULIA'
          using Pkg,SHA
          testfile=joinpath(realpath(pwd()),"test","runtests.jl")
          original=read(testfile,String)
          boundary=findfirst("@test radiation_alloc <= radiation_output_bytes + 2_250_000",original).start
          println("ORIGINAL_TEST_SHA256 ",bytes2hex(sha256(original)))
          # Diagnostic only: execute the original prefix through its original
          # allocation measurement, then profile it. Main's complete suite and
          # original assertion remain untouched in the production workflow.
          diagnostic=raw"""
          println("PARTIAL_DIAGNOSTIC_NOT_FULL_TEST_SUITE")
          println("PREFIX_ALLOC ",radiation_alloc," LIMIT ",radiation_output_bytes+2_250_000)
          using Profile,SHA
          println("VERSION ",VERSION," ARCH ",Sys.ARCH," OPT ",Base.JLOptions().opt_level,
              " DEPWARN ",Base.JLOptions().depwarn)
          println("SOURCE_SHA256 ",bytes2hex(sha256(read(joinpath(pkgdir(DiffMoM),"src","postprocessing","FarField.jl")))))
          println("POST_PROFILE_IMPORT_ALLOC ",_radiation_vectors_allocation(
              mesh_radiation_alloc,rwg_radiation_alloc,grid_radiation_alloc,2π))
          Profile.Allocs.clear()
          Profile.Allocs.@profile sample_rate=1.0 _radiation_vectors_allocation(
              mesh_radiation_alloc,rwg_radiation_alloc,grid_radiation_alloc,2π)
          groups=Dict{String,Tuple{Int,Int}}()
          for allocation in Profile.Allocs.fetch().allocs
              frame=findfirst(f->occursin("FarField.jl",String(f.file)),allocation.stacktrace)
              key=frame===nothing ? string(allocation.type) : string(allocation.stacktrace[frame])
              bytes,count=get(groups,key,(0,0))
              groups[key]=(bytes+allocation.size,count+1)
          end
          for (key,(bytes,count)) in sort!(collect(groups);by=x->-last(x)[1])[1:min(40,length(groups))]
              println("PROFILE ",bytes," ",count," ",key)
          end
          println("RADIATION_ARM64_PARTIAL_PKG_PROFILE_COMPLETE")
          """
          try
              write(testfile,original[1:prevind(original,boundary)]*diagnostic)
              Pkg.test(;coverage=false,
                  julia_args=["--check-bounds=yes","--compiled-modules=yes","--depwarn=yes"],
                  force_latest_compatible_version=false,allow_reresolve=true)
          finally
              write(testfile,original)
              @assert sha256(read(testfile))==sha256(original)
          end
          println("ORIGINAL_TEST_RESTORED")
          JULIA
          julia --startup-file=no --project=. "$RUNNER_TEMP/radiation-pkg-profile.jl"
