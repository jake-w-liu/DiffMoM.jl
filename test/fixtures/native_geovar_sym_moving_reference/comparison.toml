source_unchanged = true

# Status legend: IMPLEMENTED means the adapter now resolves the case and the
# retained resolved_<case> literal (the adapter's exact resolved geometry) is
# native-bit-identical; the listed matched literal is the retained native
# oracle pair. NEAREST marks the r>=3 cases whose native law is unconfirmed and
# still rejected. The full law -> REF2 3*r*delta/4 floored to
# min(cell,box/32) in mixed lists, ordinary ceil(c*r/2)-capped ramped shares
# with a 3*c*r*delta/8 coarse-raster cap, the 3*r*delta/4>cell anchor gate ->
# is bit-verified across grids, signs, and repetitions.
[[cases]]
case = "only_d0625"
ps2 = "3"
delta = 0.0625
matched = "literal_ref1_d0625"
status = "IMPLEMENTED"
bit_identical_s = true
full_s_error = 0.0
note = "ref-only r=1: v1 takes -delta/2, REF2 takes +3*delta/4"
